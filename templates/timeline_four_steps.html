<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>timeline_four_steps</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    #slide-root {
      width: 1280px; height: 720px; overflow: hidden; position: relative;
      background: var(--bg-color, #F8FAFC);
      font-family: var(--font-body, 'Inter', sans-serif);
      display: flex; flex-direction: column;
    }
    .header {
      height: 140px; background: var(--primary-color, #0F172A);
      display: flex; align-items: center; padding: 0 80px; position: relative; z-index: 10;
    }
    [data-pptx-role="headline"] {
      font-family: var(--font-heading, 'Montserrat', sans-serif);
      font-size: 48px; font-weight: 800; color: #FFFFFF;
    }
    .timeline-container {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 0 80px; gap: 40px; position: relative; z-index: 10;
    }
    .timeline-step {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 20px;
      text-align: center;
    }
    .step-number {
      width: 80px; height: 80px; background: var(--accent-color, #10B981);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #FFF; font-size: 32px; font-weight: 800;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .step-text {
      font-size: 20px; font-weight: 600; color: #334155; line-height: 1.4;
    }
    .connector {
      flex: 1; height: 4px; background: #E2E8F0; margin-top: 38px;
    }
  </style>
</head>
<body>
<div id="slide-root">
  <div data-pptx-role="background-shape" id="bg-shape" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0;"></div>

  <div class="header" data-pptx-role="decorative-bar" id="header-bg">
    <h1 data-pptx-role="headline" id="slide-headline"></h1>
  </div>

  <div class="timeline-container" id="timeline-list">
    <!-- Steps injected here -->
  </div>

  <div style="height: 10px; background: var(--accent-color, #10B981);" data-pptx-role="decorative-bar"></div>
</div>

<script>
  window.__RENDER_SLIDE__ = function(slide, gs) {
    var c = slide.content || {};
    var root = document.getElementById('slide-root');
    var bg   = document.getElementById('bg-shape');
    var hb   = document.getElementById('header-bg');

    if (gs) {
      if (gs.primary_color) {
        root.style.setProperty('--primary-color', gs.primary_color);
        if (hb) hb.style.backgroundColor = gs.primary_color;
      }
      if (gs.accent_color)     root.style.setProperty('--accent-color',  gs.accent_color);
      if (gs.background_color) {
        root.style.setProperty('--bg-color', gs.background_color);
        if (bg) bg.style.backgroundColor = gs.background_color;
      }
    }

    document.getElementById('slide-headline').textContent = c.headline || '';

    var steps = c.timeline_steps || [];
    var container = document.getElementById('timeline-list');
    if (container && steps.length) {
      container.innerHTML = '';
      steps.slice(0, 4).forEach(function(text, i) {
        var step = document.createElement('div');
        step.className = 'timeline-step';
        step.setAttribute('data-pptx-role', 'bullet');
        step.innerHTML = '<div class="step-number" style="background:var(--accent-color)">' + (i+1) + '</div>' +
                         '<div class="step-text">' + text + '</div>';
        container.appendChild(step);
        
        if (i < steps.length - 1 && i < 3) {
          var conn = document.createElement('div');
          conn.className = 'connector';
          container.appendChild(conn);
        }
      });
    }
  };
  if (window.__SLIDE_DATA__) window.__RENDER_SLIDE__(window.__SLIDE_DATA__, window.__GLOBAL_STYLES__);
</script>
</body>
</html>
