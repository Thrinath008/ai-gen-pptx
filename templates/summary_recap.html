<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>summary_recap</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    #slide-root {
      width: 1280px; height: 720px; overflow: hidden; position: relative;
      background: var(--bg-color, #F8FAFC);
      font-family: var(--font-body, 'Inter', sans-serif);
      display: flex; flex-direction: column;
    }
    .header {
      height: 160px; background: var(--primary-color, #0F172A);
      display: flex; align-items: center; padding: 0 80px; position: relative; z-index: 10;
    }
    [data-pptx-role="headline"] {
      font-family: var(--font-heading, 'Montserrat', sans-serif);
      font-size: 52px; font-weight: 800; color: #FFFFFF;
    }
    .summary-area {
      flex: 1; padding: 60px 80px; display: flex; flex-direction: column; gap: 30px;
      position: relative; z-index: 10;
    }
    .summary-box {
      background: #FFFFFF; border-left: 12px solid var(--accent-color, #10B981);
      padding: 40px; border-radius: 0 20px 20px 0; box-shadow: 0 15px 30px rgba(0,0,0,0.05);
    }
    [data-pptx-role="body"] {
      font-size: 28px; line-height: 1.5; color: #1E293B; font-weight: 600;
    }
    .points-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    }
    .point-item {
      background: rgba(255,255,255,0.8); padding: 20px; border-radius: 12px;
      display: flex; align-items: center; gap: 15px; font-size: 20px; color: #334155;
    }
    .point-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--accent-color, #10B981);
    }
  </style>
</head>
<body>
<div id="slide-root">
  <div data-pptx-role="background-shape" id="bg-shape" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0;"></div>

  <div class="header" data-pptx-role="decorative-bar" id="header-bg">
    <h1 data-pptx-role="headline" id="slide-headline">Lesson Summary</h1>
  </div>

  <div class="summary-area">
    <div class="summary-box">
      <p data-pptx-role="body" id="slide-body"></p>
    </div>
    <div class="points-grid" id="points-grid"></div>
  </div>
</div>

<script>
  window.__RENDER_SLIDE__ = function(slide, gs) {
    var c = slide.content || {};
    var root = document.getElementById('slide-root');
    var bg   = document.getElementById('bg-shape');
    var hb   = document.getElementById('header-bg');

    if (gs) {
      if (gs.primary_color) {
        root.style.setProperty('--primary-color', gs.primary_color);
        if (hb) hb.style.backgroundColor = gs.primary_color;
      }
      if (gs.accent_color)     root.style.setProperty('--accent-color',  gs.accent_color);
      if (gs.background_color) {
        root.style.setProperty('--bg-color', gs.background_color);
        if (bg) bg.style.backgroundColor = gs.background_color;
      }
    }

    document.getElementById('slide-headline').textContent = c.headline || 'Summary Recap';
    document.getElementById('slide-body').textContent = c.body_text || '';

    var grid = document.getElementById('points-grid');
    if (grid && Array.isArray(c.bullet_points)) {
      grid.innerHTML = '';
      c.bullet_points.slice(0, 4).forEach(function(text) {
        var item = document.createElement('div');
        item.className = 'point-item';
        item.setAttribute('data-pptx-role', 'bullet');
        item.innerHTML = '<div class="point-dot"></div><span>' + text + '</span>';
        grid.appendChild(item);
      });
    }
  };
  if (window.__SLIDE_DATA__) window.__RENDER_SLIDE__(window.__SLIDE_DATA__, window.__GLOBAL_STYLES__);
</script>
</body>
</html>
