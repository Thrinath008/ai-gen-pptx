<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>two_col_image_right</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    #slide-root {
      width: 1280px; height: 720px; overflow: hidden; position: relative;
      background: var(--bg-color, #FFFFFF);
      font-family: var(--font-body, 'Inter', sans-serif);
      display: flex; flex-direction: column;
    }
    .header-bar {
      height: 12px; background: var(--primary-color, #1A6B3A); width: 100%; flex-shrink: 0;
    }
    .content-area {
      flex: 1; display: flex; flex-direction: row; padding: 60px 80px; gap: 60px; align-items: center;
    }
    .col-text {
      flex: 0 0 55%; display: flex; flex-direction: column; gap: 24px;
    }
    .eyebrow {
      font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em;
      color: var(--accent-color, #2980B9);
    }
    [data-pptx-role="headline"] {
      font-family: var(--font-heading, 'Playfair Display', serif);
      font-size: 52px; font-weight: 700; color: var(--primary-color, #1A6B3A); line-height: 1.1;
    }
    .divider {
      width: 80px; height: 6px; background: var(--accent-color, #2980B9); border-radius: 3px;
    }
    [data-pptx-role="body"] {
      font-size: 22px; line-height: 1.6; color: #333;
    }
    .bullet-list {
      display: flex; flex-direction: column; gap: 14px;
    }
    [data-pptx-role="bullet"] {
      display: flex; gap: 15px; font-size: 19px; color: #444; line-height: 1.4;
    }
    .col-image {
      flex: 1; height: 500px; border-radius: 24px; overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      background: #E2E8F0;
    }
    .footer {
      height: 60px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 80px; border-top: 1px solid #EEE; font-size: 12px; color: #94A3B8;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
<div id="slide-root">
  <!-- Solid Background for PPTX -->
  <div data-pptx-role="background-shape" id="bg-shape" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0;"></div>

  <div class="header-bar" data-pptx-role="decorative-bar" style="z-index:5;"></div>

  <div class="content-area" style="position:relative; z-index:10;">
    <div class="col-text">
      <div class="eyebrow" id="slide-eyebrow"></div>
      <h1 data-pptx-role="headline" id="slide-headline"></h1>
      <div class="divider" data-pptx-role="accent-shape"></div>
      <p data-pptx-role="body" id="slide-body"></p>
      <div class="bullet-list" id="slide-bullets"></div>
    </div>
    <div class="col-image" data-pptx-role="image-placeholder" id="slide-image"></div>
  </div>

  <div class="footer" style="position:relative; z-index:10;">
    <div id="footer-school"></div>
    <div id="footer-teacher"></div>
  </div>
</div>

<script>
  window.__RENDER_SLIDE__ = function(slide, gs) {
    var c = slide.content || {}, v = slide.visuals || {}, m = slide.metadata || {};
    var root = document.getElementById('slide-root');
    var bg   = document.getElementById('bg-shape');

    if (gs) {
      if (gs.primary_color)    root.style.setProperty('--primary-color', gs.primary_color);
      if (gs.accent_color)     root.style.setProperty('--accent-color',  gs.accent_color);
      if (gs.background_color) {
        root.style.setProperty('--bg-color', gs.background_color);
        if (bg) bg.style.backgroundColor = gs.background_color;
      }
      if (gs.font_family)      root.style.setProperty('--font-body',    gs.font_family);
      if (gs.heading_font)     root.style.setProperty('--font-heading', gs.heading_font);
    }

    document.getElementById('slide-headline').textContent = c.headline || '';
    document.getElementById('slide-eyebrow').textContent = c.eyebrow || '';
    
    var b = document.getElementById('slide-body');
    if (b) { b.textContent = c.body_text || ''; b.style.display = c.body_text ? 'block' : 'none'; }

    var bl = document.getElementById('slide-bullets');
    if (bl && Array.isArray(c.bullet_points)) {
      bl.innerHTML = '';
      c.bullet_points.forEach(function(p) {
        var el = document.createElement('div');
        el.setAttribute('data-pptx-role', 'bullet');
        el.innerHTML = '<span style="color:var(--accent-color); font-weight:bold;">•</span> <span>' + p + '</span>';
        bl.appendChild(el);
      });
    }

    var img = document.getElementById('slide-image');
    if (img && v.image_url) {
      img.style.backgroundImage = 'url("' + v.image_url + '")';
      img.style.backgroundSize = 'cover';
      img.style.backgroundPosition = 'center';
      img.dataset.imageSrc = v.image_url;
    }

    document.getElementById('footer-school').textContent = m.school || '';
    document.getElementById('footer-teacher').textContent = m.teacher || '';
  };
  if (window.__SLIDE_DATA__) window.__RENDER_SLIDE__(window.__SLIDE_DATA__, window.__GLOBAL_STYLES__);
</script>
</body>
</html>
