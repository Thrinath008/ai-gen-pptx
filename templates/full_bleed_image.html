<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>full_bleed_image</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    #slide-root {
      width: 1280px; height: 720px; overflow: hidden; position: relative;
      background: #000;
      font-family: var(--font-body, 'Inter', sans-serif);
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    #bg-image {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; opacity: 0.8;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
      z-index: 2;
    }
    .text-box {
      position: relative; z-index: 10; padding: 80px;
    }
    [data-pptx-role="headline"] {
      font-family: var(--font-heading, 'Montserrat', sans-serif);
      font-size: 64px; font-weight: 800; color: #FFFFFF; margin-bottom: 20px;
    }
    [data-pptx-role="body"] {
      font-size: 28px; line-height: 1.4; color: #E2E8F0; max-width: 900px;
    }
    .caption-box {
      background: var(--accent-color, #10B981); color: #FFF;
      display: inline-block; padding: 10px 20px; border-radius: 8px;
      font-weight: 700; font-size: 18px; margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div id="slide-root">
  <img id="bg-image" data-pptx-role="image" src="" alt="">
  <div class="overlay"></div>

  <div class="text-box">
    <div class="caption-box" id="slide-caption" data-pptx-role="subheadline"></div>
    <h1 data-pptx-role="headline" id="slide-headline"></h1>
    <p data-pptx-role="body" id="slide-body"></p>
  </div>
</div>

<script>
  window.__RENDER_SLIDE__ = function(slide, gs) {
    var c = slide.content || {}, v = slide.visuals || {};
    var root = document.getElementById('slide-root');

    if (gs) {
      if (gs.accent_color) root.style.setProperty('--accent-color', gs.accent_color);
    }

    var img = document.getElementById('bg-image');
    if (img && v.image_url) img.src = v.image_url;

    document.getElementById('slide-headline').textContent = c.headline || '';
    document.getElementById('slide-body').textContent = c.body_text || '';
    
    var cap = document.getElementById('slide-caption');
    if (cap) {
      cap.textContent = c.caption || c.subheadline || '';
      cap.style.display = (c.caption || c.subheadline) ? 'inline-block' : 'none';
    }
  };
  if (window.__SLIDE_DATA__) window.__RENDER_SLIDE__(window.__SLIDE_DATA__, window.__GLOBAL_STYLES__);
</script>
</body>
</html>
