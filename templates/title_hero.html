<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>title_hero</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    #slide-root {
      width: 1280px; height: 720px; overflow: hidden; position: relative;
      background: var(--primary-color, #0F172A);
      font-family: var(--font-body, 'Inter', sans-serif);
      display: flex; align-items: center; justify-content: center;
    }
    /* Solid, high-contrast container */
    .main-box {
      width: 1000px; padding: 100px; position: relative; z-index: 10;
      border-left: 16px solid var(--accent-color, #10B981);
      background: rgba(0, 0, 0, 0.2); /* Subtle dark overlay for depth */
    }
    .eyebrow {
      font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4em;
      color: var(--accent-color, #10B981); margin-bottom: 30px;
    }
    [data-pptx-role="headline"] {
      font-family: var(--font-heading, 'Playfair Display', serif);
      font-size: 88px; font-weight: 800; color: #FFFFFF; line-height: 1.0;
      margin-bottom: 40px; text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    }
    [data-pptx-role="body"] {
      font-size: 28px; color: #E2E8F0; line-height: 1.5; max-width: 800px; font-weight: 400;
    }
    .footer {
      position: absolute; bottom: 60px; left: 100px; right: 100px;
      display: flex; justify-content: space-between; align-items: center;
      color: #94A3B8; font-size: 14px; text-transform: uppercase;
      letter-spacing: 0.15em; z-index: 10; font-weight: 700;
    }
    /* Decorative elements */
    .deco-circle {
      position: absolute; width: 600px; height: 600px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05); z-index: 1;
    }
  </style>
</head>
<body>
<div id="slide-root">
  <!-- Solid Background Shape -->
  <div data-pptx-role="background-shape" id="bg-shape" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0;"></div>

  <div class="deco-circle" style="top: -200px; right: -200px;"></div>
  <div class="deco-circle" style="bottom: -300px; left: -100px;"></div>

  <div class="main-box" data-pptx-role="accent-shape">
    <div class="eyebrow" id="slide-eyebrow" data-pptx-role="subheadline"></div>
    <h1 data-pptx-role="headline" id="slide-headline"></h1>
    <p data-pptx-role="body" id="slide-body"></p>
  </div>

  <div class="footer">
    <div id="footer-school"></div>
    <div id="footer-class"></div>
  </div>
</div>

<script>
  window.__RENDER_SLIDE__ = function(slide, gs) {
    var c = slide.content || {}, m = slide.metadata || {};
    var root = document.getElementById('slide-root');
    var bg   = document.getElementById('bg-shape');

    if (gs) {
      if (gs.primary_color)    root.style.setProperty('--primary-color', gs.primary_color);
      if (gs.accent_color)     root.style.setProperty('--accent-color',  gs.accent_color);
      
      var grad = 'linear-gradient(135deg, ' + (gs.primary_color || '#0F172A') + ' 0%, #020617 100%)';
      root.style.background = grad;
      if (bg) bg.style.background = grad;
    }

    document.getElementById('slide-headline').textContent = c.headline || '';
    document.getElementById('slide-eyebrow').textContent = c.eyebrow || c.subheadline || '';
    document.getElementById('slide-body').textContent = c.body_text || '';
    
    document.getElementById('footer-school').textContent = m.school || '';
    document.getElementById('footer-class').textContent = m.class_name || '';
  };
  if (window.__SLIDE_DATA__) window.__RENDER_SLIDE__(window.__SLIDE_DATA__, window.__GLOBAL_STYLES__);
</script>
</body>
</html>
