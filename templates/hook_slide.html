<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280" />
  <title>hook_slide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    #slide-root {
      width: 1280px; height: 720px; overflow: hidden; position: relative;
      background: var(--primary-color, #0F172A);
      font-family: var(--font-body, 'Inter', sans-serif);
      display: flex; align-items: center; justify-content: center;
    }
    .hook-box {
      width: 1100px; padding: 80px; text-align: center; position: relative; z-index: 10;
    }
    .quote-mark {
      font-size: 120px; color: var(--accent-color, #10B981); opacity: 0.3;
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    }
    [data-pptx-role="headline"] {
      font-family: var(--font-heading, 'Montserrat', sans-serif);
      font-size: 48px; font-weight: 800; color: var(--accent-color, #10B981);
      margin-bottom: 40px; text-transform: uppercase; letter-spacing: 0.2em;
    }
    [data-pptx-role="body"] {
      font-size: 44px; line-height: 1.3; color: #FFFFFF; font-weight: 700;
      font-style: italic;
    }
  </style>
</head>
<body>
<div id="slide-root">
  <div data-pptx-role="background-shape" id="bg-shape" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0;"></div>

  <div class="hook-box">
    <div class="quote-mark">“</div>
    <h1 data-pptx-role="headline" id="slide-headline">Did You Know?</h1>
    <p data-pptx-role="body" id="slide-body"></p>
  </div>
</div>

<script>
  window.__RENDER_SLIDE__ = function(slide, gs) {
    var c = slide.content || {};
    var root = document.getElementById('slide-root');
    var bg   = document.getElementById('bg-shape');

    if (gs) {
      if (gs.primary_color) {
        root.style.setProperty('--primary-color', gs.primary_color);
        if (bg) bg.style.backgroundColor = gs.primary_color;
      }
      if (gs.accent_color) root.style.setProperty('--accent-color', gs.accent_color);
    }

    document.getElementById('slide-headline').textContent = c.headline || 'Did You Know?';
    document.getElementById('slide-body').textContent = c.hook_fact || c.body_text || '';
  };
  if (window.__SLIDE_DATA__) window.__RENDER_SLIDE__(window.__SLIDE_DATA__, window.__GLOBAL_STYLES__);
</script>
</body>
</html>
